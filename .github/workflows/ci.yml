name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lowpo11y_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lowpo11y_test
      TEST_S3_ENDPOINT: http://127.0.0.1:5055
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start S3-compatible test server (moto)
        run: |
          pipx install "moto[server]"
          nohup moto_server -p 5055 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5055/ >/dev/null && break; sleep 1; done
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Backup and restore rehearsal
        env:
          PG: postgres://postgres:postgres@localhost:5432
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          pg_dump --version
          psql -q "$PG/postgres" -c "create database backup_src" -c "create database backup_scratch"
          DATABASE_URL=$PG/backup_src pnpm db:migrate
          psql -q "$PG/backup_src" -c "insert into users (email, password_hash, display_name, role) values ('ci@example.test', 'x', 'CI', 'admin')"
          SOURCE_URL=$PG/backup_src SCRATCH_URL=$PG/backup_scratch OUT=backup BACKUP_PASSPHRASE=ci-rehearsal scripts/backup/backup-and-verify.sh
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  cross-browser:
    # A smoke subset of the E2E suite in Firefox and WebKit (Safari's engine).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_CROSS_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: pnpm e2e --project=firefox --project=webkit
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-browser
          path: playwright-report
          retention-days: 7
